; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
	nrf24/RF24 @ ^1.4.11
	nrf24/RF24Network @ ^2.1.2
	knolleary/PubSubClient @ ^2.8
	tobozo/YAMLDuino @ ^1.5.0
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^4.0.6
	adafruit/Adafruit SHT4x Library @ ^1.0.5
	adafruit/Adafruit BMP280 Library @ ^3.0.0

; Upload firmware and filesystem over USB serial (default).
[env:nodemcu-32s]

; Upload firmware and filesystem over Wi-Fi using ArduinoOTA.
; Set upload_port to the device IP address or its "<hostname>.local" mDNS name,
; and set upload_flags auth to match OTA_PASSWORD above (leave blank if unset).
[env:nodemcu-32s-ota]
upload_protocol = espota
upload_port = 192.168.1.127
upload_flags = --auth=ota
